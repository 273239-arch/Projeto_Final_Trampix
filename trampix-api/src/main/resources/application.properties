# Nome da aplicação
spring.application.name=trampix-api

# Conexão com o MySQL (cria o banco "trampix" se ele não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/trampix?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# TROQUE pelo seu usuário e senha do MySQL
spring.datasource.username=nat
spring.datasource.password=123@Mudar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: cria/ajusta as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console (bom para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Mensagens de validação em português (ex.: "não deve estar em branco")
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# JWT
# O segredo vem da variável de ambiente TRAMPIX_JWT_SEGREDO. O valor depois dos ":" é só
# para desenvolvimento. Em produção, defina a variável com pelo menos 32 caracteres aleatórios.
trampix.jwt.segredo=${TRAMPIX_JWT_SEGREDO:dev-somente-local-gS5uh93rSqNDvLzdXgF5ZjkQIqSGOB3WQSu3kwxIIJpbUVvrbGQwVlaA}
# Tempo de validade do token (ex.: 30m, 2h, 1d)
trampix.jwt.expiracao=2h

# CORS: origens que podem chamar a API pelo navegador (o Angular roda na 4200)
trampix.cors.origens=http://localhost:4200

# ADMIN inicial: criado na subida se ainda não existir nenhum ADMIN.
# Sem as variáveis TRAMPIX_ADMIN_EMAIL e TRAMPIX_ADMIN_SENHA, nada é criado (só um aviso no log).
trampix.admin.email=${TRAMPIX_ADMIN_EMAIL:}
trampix.admin.senha=${TRAMPIX_ADMIN_SENHA:}
