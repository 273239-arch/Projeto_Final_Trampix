# Nome da aplicação
spring.application.name=trampix-api

# Conexão com o MySQL (cria o banco "trampix" se ele não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/trampix?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# TROQUE pelo seu usuário e senha do MySQL
spring.datasource.username=nat
spring.datasource.password=123@Mudar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update: cria/ajusta as tabelas sem apagar os dados
spring.jpa.hibernate.ddl-auto=update

# Mostra o SQL no console (bom para aprender)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
