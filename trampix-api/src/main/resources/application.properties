spring.application.name=trampix-api

# conexão com o MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/trampix?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# usuário e senha do MySQL
spring.datasource.username=nat
spring.datasource.password=123@Mudar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# cria e atualiza as tabelas
spring.jpa.hibernate.ddl-auto=update

# mostra o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# mensagens em português
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# segredo do token JWT
trampix.jwt.segredo=${TRAMPIX_JWT_SEGREDO:dev-somente-local-gS5uh93rSqNDvLzdXgF5ZjkQIqSGOB3WQSu3kwxIIJpbUVvrbGQwVlaA}
# validade do token
trampix.jwt.expiracao=2h

# origens liberadas no CORS
trampix.cors.origens=http://localhost:4200

# e-mail e senha do ADMIN inicial
trampix.admin.email=${TRAMPIX_ADMIN_EMAIL:}
trampix.admin.senha=${TRAMPIX_ADMIN_SENHA:}
